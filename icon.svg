<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Instagram Signature Gradient -->
    <radialGradient id="ig-radial" cx="20%" cy="110%" r="130%">
      <stop offset="0%" stop-color="#ffdc80"/>
      <stop offset="20%" stop-color="#fcb045"/>
      <stop offset="40%" stop-color="#fd1d1d"/>
      <stop offset="70%" stop-color="#e1306c"/>
      <stop offset="90%" stop-color="#c13584"/>
      <stop offset="100%" stop-color="#833ab4"/>
    </radialGradient>

    <!-- Subtle Top-to-Bottom Gloss Overlay -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Glyph -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#ig-radial)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#gloss)"/>

  <!-- Inner Soft Border -->
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Instagram Camera Dot Accent -->
  <circle cx="94" cy="34" r="5.5" fill="#ffffff" opacity="0.9" filter="url(#drop-shadow)"/>

  <!-- Centered Link Glyph (45-degree angled chain) -->
  <g filter="url(#drop-shadow)" transform="rotate(-45 64 64)">
    <!-- Left Loop -->
    <path d="M 52 50 H 42 C 34.27 50 28 56.27 28 64 C 28 71.73 34.27 78 42 78 H 52"
          fill="none"
          stroke="#ffffff"
          stroke-width="8.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Right Loop -->
    <path d="M 76 50 H 86 C 93.73 50 100 56.27 100 64 C 100 71.73 93.73 78 86 78 H 76"
          fill="none"
          stroke="#ffffff"
          stroke-width="8.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Center Connecting Bar -->
    <line x1="46" y1="64" x2="82" y2="64"
          stroke="#ffffff"
          stroke-width="8.5"
          stroke-linecap="round"/>
  </g>
</svg>